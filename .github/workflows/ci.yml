name: CI (Host Tests, Linux Build & Web Parity)

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Host Tests, Linux Targets & Web Parity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libpcap-dev libncurses-dev qt6-base-dev

      - name: Run Make host tests & Web JS parity checks
        run: |
          make all
          make test
          make linux
          make demo

      - name: Build CMake targets (including Qt6 GUI) & run CTest
        run: |
          cmake -B build_cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build_cmake --config Release -j$(nproc)
          ctest --test-dir build_cmake --output-on-failure
