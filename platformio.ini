; PlatformIO Project Configuration File
; Pwnagotchi-ZeroDay - Functional C++17 Pwnagotchi-style UI & WiFi Scanner for M5Stick

[platformio]
default_envs = m5stick-c

[common]
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
lib_deps =
    m5stack/M5Unified @ >=0.1.12

; Works with M5StickC (80x160) and M5StickC Plus (135x240) via M5Unified auto-detection
[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

; Works with M5StickC Plus2 (ESP32-PICO-V3-02, 8MB Flash, 135x240)
[env:m5stick-c-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
monitor_speed = 115200
upload_speed = 1500000
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

; Desktop host environment for testing the pure functional core without hardware
[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
