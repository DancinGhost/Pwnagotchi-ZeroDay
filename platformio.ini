; PlatformIO Multi-Device Configuration
; pwnagotchi-zeroday — Portable C++17 Functional Core + Multi-Platform Hardware Shells

[platformio]
default_envs = m5stick-c
src_dir = platforms
include_dir = core/include

[common]
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Icore/include
    -Irender/include
    ; Nothing in this codebase throws/catches (the functional core reports failure via
    ; return values, never exceptions) or uses dynamic_cast/typeid, so both are pure
    ; overhead here: disabling them removes exception-unwind tables and RTTI metadata
    ; from every one of our own translation units (and from M5GFX/M5Unified, which are
    ; built from source for this project), with no change in behavior.
    -fno-exceptions
    -fno-rtti
m5_lib_deps =
    m5stack/M5Unified @ >=0.1.12
; The stock Arduino-ESP32 "default" partition table reserves half of flash for a second
; OTA slot (app0 + app1, ~1.3MB each). This project has no OTA update code, so that
; reservation is pure waste; huge_app.csv instead gives one ~3MB app partition (the
; standard scheme for exactly this "sketch too big" situation), sized to fit a 4MB chip.
m5_partitions = huge_app.csv

; M5StickC (160x80) and M5StickC Plus (240x135) via M5Unified auto-detection
[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.partitions = ${common.m5_partitions}
monitor_speed = 115200
upload_speed = 1500000
build_src_filter = -<*> +<m5stick/*>
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps = ${common.m5_lib_deps}

; M5StickC Plus2 (ESP32-PICO-V3-02, 8MB Flash, 240x135)
[env:m5stick-c-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = ${common.m5_partitions}
monitor_speed = 115200
upload_speed = 1500000
build_src_filter = -<*> +<m5stick/*>
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps = ${common.m5_lib_deps}

; M5Stack Core2 (320x240 QVGA, 3 touch buttons — uses wide layout & Button C prev-theme)
[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
board_build.partitions = ${common.m5_partitions}
monitor_speed = 115200
build_src_filter = -<*> +<m5stick/*>
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps = ${common.m5_lib_deps}

; LILYGO T-Deck Plus / Portable Plus (ESP32-S3FN16R8, 16MB Flash, 8MB OPI PSRAM,
; 320x240 ST7789 IPS LCD, GT911 Capacitive Touch, Trackball, QWERTY Keyboard,
; Battery ADC Monitor, Peripheral Power Gate, MIA-M10Q GNSS / GPS)
[env:t-deck-plus]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<tdeck/*>
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    lovyan03/LovyanGFX @ >=1.1.12

; Standard LILYGO T-Deck alias
[env:t-deck]
extends = env:t-deck-plus

; Desktop / Linux / Raspberry Pi native simulator target
[env:native]
platform = native
build_src_filter = -<*> +<native/*>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -Icore/include
    -Irender/include
