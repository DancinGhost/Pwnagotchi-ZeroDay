; PlatformIO Multi-Device Configuration
; Pwnagotchi-ZeroDay — Portable C++17 Functional Core + Multi-Platform Hardware Shells

[platformio]
default_envs = m5stick-c
src_dir = platforms
include_dir = core/include

[common]
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Icore/include
    -Irender/include
m5_lib_deps =
    m5stack/M5Unified @ >=0.1.12

; M5StickC (160x80) and M5StickC Plus (240x135) via M5Unified auto-detection
[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_src_filter = -<*> +<m5stick/*>
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps = ${common.m5_lib_deps}

; M5StickC Plus2 (ESP32-PICO-V3-02, 8MB Flash, 240x135)
[env:m5stick-c-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
monitor_speed = 115200
upload_speed = 1500000
build_src_filter = -<*> +<m5stick/*>
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps = ${common.m5_lib_deps}

; M5Stack Core2 (320x240 QVGA, 3 touch buttons — uses wide layout & Button C prev-theme)
[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<m5stick/*>
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags}
lib_deps = ${common.m5_lib_deps}

; Desktop / Linux / Raspberry Pi native simulator target
[env:native]
platform = native
build_src_filter = -<*> +<native/*>
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -Icore/include
    -Irender/include
